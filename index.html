<style>

    pointer-events:none; opacity:0; transition:opacity 2.4s ease; }
  .word.l { left:5vw; } .word.r { right:5vw; font-style:italic; }
  body.ready .word { opacity:1; }
  /* tirai pembuka: satu kalimat + satu tombol, langit samar di belakangnya */
  .veil { position:fixed; inset:0; z-index:5; display:grid; place-content:center; justify-items:center; gap:30px;
    padding:24px; text-align:center; transition:opacity 1.2s ease; }
  .veil.gone { opacity:0; pointer-events:none; }
  .veil-text { margin:0; max-width:20ch; font-family:"Instrument Serif",Georgia,serif; font-style:italic; font-weight:400;
    font-size:clamp(26px,3.6vw,42px); line-height:1.18; color:rgba(245,246,251,.88); opacity:0; animation:veilIn 2.6s ease .5s forwards; }
  .veil-btn { font:500 13px/1 Inter,system-ui,sans-serif; letter-spacing:.06em; color:var(--ink);
    background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:999px; padding:12px 26px; cursor:pointer;
    opacity:0; animation:veilIn 1.8s ease 1.8s forwards; transition:background .3s ease, border-color .3s ease; touch-action:manipulation; }
  .veil-btn:hover { background:rgba(255,255,255,.1); border-color:rgba(245,246,251,.42); }
  .veil-btn:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  @keyframes veilIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  body:not(.started) .ctrl, body:not(.started) .hint { opacity:0; pointer-events:none; }
  .msg { position:fixed; left:50%; bottom:calc(11vh + var(--sb)); transform:translate(-50%,8px); width:min(560px,calc(100% - 32px));
    margin:0; text-align:center; font-family:"Instrument Serif",Georgia,serif; font-style:italic;
    font-size:clamp(18px,2.1vw,25px); pointer-events:none; opacity:0; transition:opacity 1.6s ease, transform 1.6s ease; }
  body.heart .msg { opacity:.88; transform:translate(-50%,0); transition-delay:1.4s; }
  /* dua baris bertumpuk -> pesan berganti dengan cross-fade pelan */
  .msg-line { position:absolute; left:0; right:0; bottom:0; opacity:0; transition:opacity 2.6s ease; }
  .msg-line.on { opacity:1; }
  /* tanda tangan di bawah nama, muncul setelah tulisan selesai */
  .sig { position:fixed; left:50%; top:var(--sigY,72%); transform:translate(-50%,6px); margin:0; white-space:nowrap;

    opacity:0; transform:translateY(6px); pointer-events:none; transition:opacity 1s ease, transform 1s ease; }
  body.name .swatches { opacity:1; transform:none; pointer-events:auto; transition-delay:1.2s; }
  body.name .hint { opacity:0; }
  .sw-label { margin-right:6px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
    min-width:7.5em; text-align:right; }
  .sw { position:relative; width:34px; height:34px; padding:0; border:0; border-radius:50%; background:none; cursor:pointer;
    touch-action:manipulation; }
  .sw::before { content:""; position:absolute; inset:11px; border-radius:50%;
    background:radial-gradient(circle at 35% 32%, var(--b) 0 22%, var(--a) 72%);
    box-shadow:0 0 0 1px rgba(255,255,255,.16); transition:inset .25s ease, box-shadow .25s ease; }
  .sw:hover::before { inset:10px; }
  .sw[aria-pressed="true"]::before { inset:10px; box-shadow:0 0 0 2px #07090e, 0 0 0 3px rgba(245,246,251,.75); }
  .sw:focus-visible { outline:1px solid rgba(245,246,251,.6); outline-offset:-4px; }
  /* bintang kenangan: halo tipis yang bernapas pelan; area sentuh 48px untuk jari */
  .memories { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 1.2s ease; }
  body.memvis .memories { opacity:1; }
  .memstar { position:absolute; left:0; top:0; width:48px; height:48px; margin:-24px 0 0 -24px; padding:0; border:0;
    background:none; border-radius:50%; cursor:pointer; touch-action:manipulation; pointer-events:none; will-change:transform; }
  body.memvis .memstar { pointer-events:auto; }
  .memstar::before { content:""; position:absolute; inset:12px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,244,224,0) 36%, rgba(255,244,224,.26) 52%, rgba(255,244,224,0) 72%);
    animation:breathe 4.2s ease-in-out infinite; animation-delay:var(--d,0s); transition:inset .4s ease; }
  .memstar:hover::before, .memstar.seen::before { inset:9px; }
  .memstar:focus-visible { outline:1px solid rgba(255,244,224,.6); outline-offset:-10px; }
  @keyframes breathe { 0%,100% { opacity:.45; transform:scale(.86); } 50% { opacity:.95; transform:scale(1.08); } }
  .ripple { position:absolute; left:0; top:0; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%;
    border:1px solid rgba(255,240,222,.55); box-shadow:0 0 14px rgba(255,226,196,.22), inset 0 0 8px rgba(255,226,196,.18);

    font-size:clamp(18px,2.1vw,25px); line-height:1.25; color:rgba(245,246,251,.9); }
  body.memopen .hint { opacity:0; transition-duration:.3s; }
  @media (prefers-reduced-motion:reduce) { .memstar::before { animation:none; opacity:.7; } .ripple { animation-duration:.01s; } }
  body.heart .hint { opacity:0; }
  body.ready.name .word { opacity:0; transition-duration:1s; }
  /* keluar dari mode nama: teks pinggir menunggu tulisan bintangnya bubar dulu, baru muncul */
  body.ready.unname .word { opacity:0; transition-duration:.6s; }
  .hint { position:fixed; left:24px; bottom:calc(26px + var(--sb)); margin:0; font-size:12px; letter-spacing:.02em; color:var(--muted);

  @media (hover:none) and (pointer:coarse) { .hint-mouse { display:none; } .hint-touch { display:inline; } }
  body.touched .hint, body.nohint .hint { opacity:0; }
  .ctrl { position:fixed; right:20px; bottom:calc(20px + var(--sb)); display:flex; gap:8px; transition:opacity 1.6s ease 1.2s; }
  #bSound { min-width:40px; }
  .ctrl button { font:500 13px/1 Inter,system-ui,sans-serif; color:var(--ink); background:rgba(255,255,255,.05);
    border:1px solid var(--line); border-radius:999px; padding:10px 14px; cursor:pointer; white-space:nowrap;
    touch-action:manipulation;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:background .2s, border-color .2s; }
  .ctrl button:hover { background:rgba(255,255,255,.12); }
  .ctrl button[aria-pressed="true"] { border-color:rgba(245,246,251,.55); background:rgba(255,255,255,.13); }
  .ctrl button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .fallback { position:fixed; inset:0; display:grid; place-items:center; padding:24px; text-align:center; color:var(--muted); }
  /* HP, dari bawah ke atas: tombol -> (pesan hati / petunjuk, maks 2 baris) -> "Laila" -> galaxy */
  @media (max-width:700px) {
    .word { top:calc(12% + var(--st)); transform:none; font-size:clamp(40px,13vw,64px); }

    .msg { bottom:calc(var(--sb) + 68px); line-height:1.25; font-size:clamp(17px,4.6vw,21px); }

    .swatches { left:0; right:0; justify-content:center; bottom:calc(var(--sb) + 60px); }
    .sw-label { min-width:0; }
    .mem-text { font-size:clamp(17px,4.6vw,21px); }
    .hint { left:16px; right:16px; bottom:calc(var(--sb) + 68px); text-align:center; }
    .ctrl { left:12px; right:12px; bottom:calc(var(--sb) + 14px); justify-content:center; flex-wrap:wrap; gap:6px; }
    .ctrl button { padding:10px 13px; }
  }
  @media (max-width:380px) {
    .ctrl { gap:5px; }
    .ctrl button { padding:9px 10px; font-size:12px; }
  }

<script type="module">
import * as THREE from 'three';
import { EffectComposer, RenderPass, EffectPass, BloomEffect, NoiseEffect, VignetteEffect, BlendFunction } from 'postprocessing';

/* ================= PERSONALISASI ================= */
const CONFIG = {
  // semua teks dikosongkan -> murni animasi. Isi lagi kapan saja kalau mau ada kata-kata.
  leftWord:  '',
  rightWord: '',
  // pesan di mode Hati: berganti pelan (cross-fade) tiap heartMessageEvery detik
  heartMessages: [],                    // contoh: ['setiap bintang di sini, aku nyalakan untukmu', '...']
  heartMessageEvery: 6.5,
  // pembuka: langit masih samar sampai tombol ditekan (sekaligus izin browser untuk memutar suara)
  veil: { enabled: true, text: '', button: 'Nyalakan' },
  // lagu (opsional): taruh file mp3 di folder yang sama lalu isi './lagu.mp3'.
  audioSrc: '',
  audioVolume: 0.8,                     // 0..1
  chime: true,                          // denting lonceng lembut saat menyapu bintang & berganti bentuk
  startShape: 'galaxy',                 // 'galaxy' (= bunga) | 'heart' | 'name'
  nameText: 'Laila',                    // nama yang dibentuk bintang (huruf kecil lebih cantik di font script)
  nameFont: 'Great Vibes',              // font tulisan tangan: 'Great Vibes' | 'Parisienne' | 'Allura'
  nameSignature: '',
  showHint: false,                      // petunjuk kecil "tahan & geser..." di bawah (true = tampilkan)   // muncul pelan di bawah nama setelah selesai ditulis ('' = tanpa)
  // bintang kenangan dikosongkan -> 100% pure animasi tanpa teks
  memories: [],
  // tiap bentuk punya atmosfer sendiri
  // bentuk pertama sekarang bunga (nama internalnya tetap 'galaxy' supaya pengaturan lain tidak berubah)
  paletteGalaxy: ['#F7A8D0', '#FFD3E7', '#FFC4A0', '#BBA9FF', '#FFF6FA'],   // kelopak: pink, peach, lilac, putih
  paletteHeart:  ['#FF7EA8', '#FFB3C9', '#FF9E6B', '#C58BFF', '#FFF1F5'],
  // warna tulisan nama: bisa diganti langsung dari titik-titik warna di mode Nama (pilihan terakhir diingat).
  // Tambah/ubah sesukamu: 5 warna per palet, yang pertama = warna utama (juga warna tanda tangan).
  namePalette: 'Pearl Rose',            // palet awal
  namePalettes: {
    'Pearl Rose': ['#F26A9E', '#FF9EC2', '#D4457E', '#FFC4DA', '#FFF0F6'],
    'Champagne':  ['#F6E2B3', '#FFD6E0', '#F3B98E', '#FFF4E0', '#FFFFFF'],
    'Moonlight':  ['#C2DBFF', '#E4EDFF', '#9DC2F5', '#F3F7FF', '#FFFFFF'],
    'Lavender':   ['#D4BCFF', '#ECDFFF', '#B79BF4', '#F7F1FF', '#FFFFFF'],
    'Peach':      ['#FFC6A8', '#FFDFD0', '#FF9F86', '#FFF1E8', '#FFFFFF'],
  },
  density: 1,                           // 0.5 = lebih ringan, 1.5 = lebih padat
  bloom: { intensity: 0.9, threshold: 0.22, smoothing: 0.25, radius: 0.75 },
  // strength = seberapa jauh bintang terdorong · returnSpeed = makin kecil makin lambat balik
  // curl = bintang "terbelah" ke kiri-kanan jalur kursor · jitter = variasi tiap bintang
  // slowGain = kekuatan saat kursor lewat pelan (1 = sama dengan sapuan cepat; kecil = lewat pelan cuma mengusik)
  cursor: { radiusPx: 110, strength: 4.0, maxSpeed: 0.4, impulseMax: 0.16, returnSpeed: 0.8, curl: 0.3, jitter: 0.35,
            slowGain: 0.35 },
};
/* ================================================ */

if (!CONFIG.showHint) document.body.classList.add('nohint');
document.getElementById('wl').textContent = CONFIG.leftWord;
document.getElementById('wr').textContent = CONFIG.rightWord;
const msgLines = [...document.querySelectorAll('.msg-line')];
msgLines[0].textContent = CONFIG.heartMessages[0] || '';
document.getElementById('sig').textContent = CONFIG.nameSignature || '';
document.getElementById('bName').textContent = '✧ ' + CONFIG.nameText;

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PARAMS = new URLSearchParams(location.search), DEBUG = PARAMS.has('debug');
const USE_VEIL = !!(CONFIG.veil && CONFIG.veil.enabled !== false);
const small = Math.min(innerWidth, innerHeight) < 700;
const Q = (small ? 0.6 : 1) * CONFIG.density;
const DPR = Math.min(devicePixelRatio || 1, 2);
const SAMPLES = 512;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false, depth: false });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="fallback">Browser ini tidak mendukung WebGL.</div>');
  throw e;
}
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
const TAN = Math.tan(THREE.MathUtils.degToRad(21));

/* ---------- util ---------- */
function rng(seed) {                    // mulberry32
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const smooth = (e0, e1, x) => { const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1); return t * t * (3 - 2 * t); };
const ease = (e0, e1, x) => { const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1); return t * t * t * (t * (t * 6 - 15) + 10); };
const fract = (x) => x - Math.floor(x);
const DENSITY_FALLOFF = 0.22, SIZE_FALLOFF = 0.45;
const warp = (ph) => ph + DENSITY_FALLOFF * Math.sin(ph * 6.283185307) / 6.283185307;

/* ---------- shaders ---------- */
const VERT = /* glsl */`
#define PI 3.14159265359
#define SAMPLES ${SAMPLES}.0
uniform float uTime, uMorph, uNameMix, uWriteIn, uIntro, uPixelRatio, uIntensity, uTwinkleSpeed, uCamDist, uAspect;
uniform float uBeatAmp, uDawn;        // kuat detak hati (ikut bass lagu) · langit samar di balik tirai pembuka
uniform float uLensActive, uLensRadius, uLensMag, uLensIllum;
uniform vec2 uLensPointer, uField;

// atribut dipadatkan ke vec4/vec2 supaya muat di batas 16 atribut GPU
attribute vec4 aStar;                  // seed, scale, bright, opacity
attribute vec2 aTw;                    // fase & kecepatan kelip
#define aSeed aStar.x
#define aScale aStar.y
#define aBright aStar.z
#define aOpacity aStar.w
#define aTwPhase aTw.x
#define aTwRate aTw.y
attribute vec3 aColorA, aColorB, aColorC;   // warna bunga, hati, nama
attribute vec2 aMotion;

#ifdef ARM
attribute vec3 aArm;                   // orbit, across, depth
#define aOrbit aArm.x
#define aAcross aArm.y
#define aDepth aArm.z
uniform sampler2D uPathA;
uniform float uFlow;
#endif
#if defined(ARM) || defined(CORE)
attribute vec4 aHeart;                 // w > 0: bintang tepi mengalir (x=sudut, y=inset, z=depth, w=speed); w <= 0: isi bantal 3D
attribute vec4 aName;                  // xyz = titik di huruf nama, w > 0.5 = debu aura sekitar huruf
uniform vec2 uNameSpan;                // x kiri & lebar tulisan
#endif
#ifdef AMBIENT
attribute vec3 aRand;
#endif

varying vec3 vColor;
varying float vBright, vOpacity, vRay, vDiam;

// kurva masuk-keluar yang lebih lembut dari smoothstep (turunan ke-2 juga nol di ujung)
float ease(float e0, float e1, float x) {
  float t = clamp((x - e0) / (e1 - e0), 0.0, 1.0);
  return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
}
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

// transisi melengkung seperti pusaran pita 3D (bukan garis lurus kaku)
vec3 swirlMix(vec3 a, vec3 b, float t, float seed, float zAmp, float spinAmp) {
  float arc = sin(t * PI);
  vec3 p = mix(a, b, t);
  float ang = arc * spinAmp * (0.55 + 0.65 * fract(seed * 3.71));
  float cs = cos(ang), sn = sin(ang);
  p.xy = mat2(cs, sn, -sn, cs) * p.xy;
  p.xy *= 1.0 + arc * 0.11;
  p.z += arc * (seed - 0.5) * zAmp;

#ifdef ARM
vec3 samplePath(sampler2D tex, float p) {

vec3 pathPoint(sampler2D tex, float p, float across, float depth) {

#if defined(ARM) || defined(CORE)
float nameK() { return clamp((aName.x - uNameSpan.x) / uNameSpan.y, 0.0, 1.0); }
// tulisan muncul dari kiri ke kanan, dengan jendela terbang lebih panjang & lembut
float writeProgress(float v, float seed) {
  float st = nameK() * 0.46 + seed * 0.12;
  return ease(st, st + 0.42, v);
}
// nama melayang seperti pita kaligrafi 3D + debu aura yang mengambang di sekitarnya
vec3 namePoint(float seed) {
  float nk = nameK();
  float waveZ = sin(nk * 5.0 - uTime * 0.85) * 0.22 + cos(nk * 2.8 + uTime * 0.55) * 0.09;
  float waveY = sin(nk * 4.2 - uTime * 0.72) * 0.055;

// kontur hati parametrik (sama persis dengan CPU) -> bintang tepi mengalir pelan mengelilingi garis hati
vec2 heartContour(float u) {
  float su = sin(u), cu = cos(u);
  float c2 = 2.0 * cu * cu - 1.0, c3 = cu * (2.0 * c2 - 1.0), c4 = 2.0 * c2 * c2 - 1.0;

}
// detak jantung ganda (lub-dub) bergelombang dari pusat ke tepi
float heartBeatAt(float delay) {
  float ph = fract(uTime * 0.72 - delay);
  return exp(-pow((ph - 0.12) * 15.0, 2.0)) + 0.55 * exp(-pow((ph - 0.31) * 15.0, 2.0));

vec3 heartPoint(float seed, out float beatVal) {
  vec3 base;
  float isRim = step(0.001, aHeart.w);
  if (isRim > 0.5) {
    float u = aHeart.x + uTime * aHeart.w * 0.075;
    vec2 xy = heartContour(u) * aHeart.y;
    base = vec3(xy.x, xy.y + 0.1, aHeart.z);
  } else {
    base = aHeart.xyz;

  float rDist = length(base.xy) * 0.26;
  beatVal = heartBeatAt(rDist * 0.055);
  vec3 drift = vec3(sin(uTime * 0.6 + seed * 23.0), cos(uTime * 0.5 + seed * 17.0), sin(uTime * 0.4 + seed * 11.0)) * mix(0.024, 0.012, isRim);

// bintang mulai dari posisi acak memenuhi layar, berputar, lalu ditarik ke tempatnya
vec3 introMotion(vec3 target, vec3 scattered, float progress, float seed, float travel) {
  if (progress >= 1.0) return target;
  float start = 0.14 + seed * 0.18;
  float local = clamp((progress - start) / (0.58 + travel * 0.1), 0.0, 1.0);
  float s = local * local * local * (local * (local * 6.0 - 15.0) + 10.0);
  float pull = mix(s, sin(s * PI * 0.5), 0.5);
  float ang = sin(pull * PI) * (0.44 + seed * 0.22);
  float c = cos(ang), n = sin(ang);
  return mix(vec3(scattered.x * c - scattered.y * n, scattered.x * n + scattered.y * c, scattered.z), target, pull);
}

void main() {
  float mOrg = ease(aSeed * 0.35, aSeed * 0.35 + 0.65, uMorph);
  float m = mOrg;

  vec3 pos;

  env = mix(1.0, 0.14 + 0.86 * pow(max(sin(clamp(p, 0.0, 1.0) * PI), 0.0), 0.68), ${SIZE_FALLOFF});
  endVis = smoothstep(0.0, 0.055, p) * (1.0 - smoothstep(0.945, 1.0, p));

  if (uMorph > 0.0) {

    float hn = 0.0;
    if (uNameMix > 0.0) {             // hati <-> tulisan nama
      float s2 = fract(aSeed * 7.13);
      float hnOrg = ease(s2 * 0.35, s2 * 0.35 + 0.65, uNameMix);
      hn = mix(hnOrg, writeProgress(uNameMix, s2), uWriteIn);

  endVis = mix(endVis, 1.0, m);
#endif
#ifdef CORE

  float s2c = fract(aSeed * 7.13);
  float hncOrg = ease(s2c * 0.35, s2c * 0.35 + 0.65, uNameMix);
  float hnc = mix(hncOrg, writeProgress(uNameMix, s2c), uWriteIn);

  pos = swirlMix(position, posBC, m, aSeed, 1.5, 0.68);
  flight = max(sin(m * PI), sin(hnc * PI) * m);
  nameAmt = hnc * m;
  shapeAmt = m;

  vec2 ph = vec2(aRand.x * 6.2831 + aRand.y * 2.7, aRand.y * 6.2831 + aRand.z * 3.1);

#endif

  float sx = hash(vec2(aSeed, aTwPhase)), sy = hash(vec2(aTwPhase, aScale + 0.3)), sz = hash(vec2(aSeed * 7.3, aBright));
  float reveal = smoothstep(sz * 0.015, 0.14 + sz * 0.015, uIntro) * mix(0.2, 1.0, smoothstep(0.2, 1.0, uIntro));

  reveal = max(reveal, 0.42 * uDawn);   // sebelum dinyalakan: hanya bintang langit yang samar bertebaran
#endif
#ifndef AMBIENT
  vec3 scattered = vec3((sx - 0.5) * uField.x, (sy - 0.5) * uField.y, (sz - 0.5) * 0.5);
  pos = introMotion(pos, scattered, uIntro, sz, sy);
#endif

  float tw = 0.86 + 0.14 * sin(aTwPhase + uTime * uTwinkleSpeed * aTwRate);
  vBright = uIntensity * aBright * tw;

  vBright *= 1.0 + flight * 0.28 + (shapeAmt * (1.0 - nameAmt)) * hBeat * 0.12;
#endif
  float cMix = nameAmt;
#ifdef AMBIENT
  cMix = m * uNameMix;                 // langit ikut menghangat di mode nama
#endif

  vOpacity = aOpacity * endVis * (0.92 + tw * 0.08) * smoothstep(0.0, 0.2, reveal);

const FRAG = /* glsl */`
varying vec3 vColor;
varying float vBright, vOpacity, vRay, vDiam;
// kernel B-spline kubik: titik sub-pixel digambar halus tanpa berkedip
float bspline(float x) {
  x = abs(x);
  if (x < 1.0) return (4.0 - 6.0 * x * x + 3.0 * x * x * x) / 6.0;
  float t = max(2.0 - x, 0.0);
  return t * t * t / 6.0;
}
void main() {
  vec2 px = (gl_PointCoord - 0.5) * max(vDiam, 4.0);
  vec2 pt = px * 2.0 / max(vDiam, 1e-4);
  float r = length(pt);
  float core = pow(1.0 - smoothstep(0.08, 1.0, r), 2.2);
  float rays = max(exp(-abs(pt.y) * 28.0) * (1.0 - smoothstep(0.18, 1.0, abs(pt.x))),
                   exp(-abs(pt.x) * 28.0) * (1.0 - smoothstep(0.18, 1.0, abs(pt.y)))) * 0.28 * vRay;
  float resolved = smoothstep(2.0, 4.0, vDiam);
  // 0.150904 = energi profil disc (dihitung numerik) -> kecerahan sama di semua ukuran
  float filtered = bspline(px.x) * bspline(px.y) * 0.150904 * vDiam * vDiam;
  float alpha = mix(filtered, max(core, rays), resolved) * vOpacity;
  if (alpha <= 0.0) discard;
  float white = mix(0.59, core, resolved) * smoothstep(0.9, 2.8, vBright) * 0.82;
  float energy = 1.0 - min(vColor.r, min(vColor.g, vColor.b));
  vec3 em = mix(vColor, vec3(1.0), white) * vBright * (1.0 + energy * 0.42);
  gl_FragColor = vec4(em * alpha, alpha * 0.85);
}`;

function makeCurve(fn, closed) {
  const pts = [], N = 400;
  for (let i = 0; i < (closed ? N : N + 1); i++) pts.push(fn(i / N));
  const c = new THREE.CatmullRomCurve3(pts, closed, 'centripetal');
  c.arcLengthDivisions = 640;
  return c;
}
/* ---------- bunga ----------
   tiap lengan = satu kelopak. Jalurnya: tepi kelopak, lalu tepi kelopak yang lebih kecil, lalu yang lebih kecil lagi
   (semuanya berawal & berakhir di tengah) -> bintang mengalir mengelilingi kelopak berlapis-lapis.
   Ujung kelopak sedikit berlekuk seperti sakura, dan kelopak melengkung naik ke arah kamera (terlihat 3D saat diputar). */
const FLOWER = { length: 4.6, width: 2.05, notch: 0.55, cup: 1.25, loops: [1, 0.68, 0.38] };   // panjang, lebar, lekuk ujung, lengkung 3D, lapisan kelopak
const petalPoint = (k, sc, th) => {
  const L = FLOWER.length * sc, half = (1 - Math.cos(th)) / 2;
  let u = L * half;
  const v = FLOWER.width * sc * Math.sin(th) * Math.pow(half, 0.55);
  u -= FLOWER.notch * sc * Math.exp(-(((th - Math.PI) / 0.3) ** 2));               // lekuk di ujung kelopak
  const ang = Math.PI / 2 + k * Math.PI * 2 / ARMS.length;
  const r = u / FLOWER.length;
  return new THREE.Vector3(u * Math.cos(ang) - v * Math.sin(ang), u * Math.sin(ang) + v * Math.cos(ang),
    FLOWER.cup * r * r + 0.12 * Math.sin(th * 2 + k));
};
const flowerCurve = (A, k) => {
  const pts = [], N = 150;
  FLOWER.loops.forEach((sc, li) => {
    for (let i = li ? 1 : 0; i <= N; i++) pts.push(petalPoint(k, sc, i / N * Math.PI * 2));
  });
  const c = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  c.arcLengthDivisions = 1400;
  return c;
};
function pathData(curve) {
  const S = new Float32Array(SAMPLES * 4), v = new THREE.Vector3();
  for (let i = 0; i < SAMPLES; i++) {
    curve.getPointAt(i / (SAMPLES - 1), v);
    S[i * 4] = v.x; S[i * 4 + 1] = v.y; S[i * 4 + 2] = v.z; S[i * 4 + 3] = 1;
  }

}
/* ---------- tulisan nama dari font sungguhan ----------

const NAME_W = 9.6, NAME_H = 4.4;
const nameSpan = new THREE.Vector2(-NAME_W / 2, NAME_W);

function sampleNameMask(fontFamily) {
  const fs = 240, text = CONFIG.nameText;
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
  cv.width = Math.ceil(fs * (text.length * 0.9 + 1.6)); cv.height = Math.ceil(fs * 2.2);
  ctx.font = `${fs}px ${fontFamily}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = ctx.strokeStyle = '#fff';
  ctx.lineWidth = fs * 0.014; ctx.lineJoin = 'round';     // sedikit dipertebal supaya goresan tipis tetap terisi bintang
  ctx.fillText(text, cv.width / 2, cv.height / 2);
  ctx.strokeText(text, cv.width / 2, cv.height / 2);
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data, px = [];
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let y = 0; y < cv.height; y += 1) for (let x = 0; x < cv.width; x += 1) {
    if (d[(y * cv.width + x) * 4 + 3] > 150) {
      px.push(x, y);
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  if (!px.length) return null;
  const s = Math.min(NAME_W / (x1 - x0 + 1), NAME_H / (y1 - y0 + 1)), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const pts = new Float32Array(px.length);
  for (let i = 0; i < px.length; i += 2) { pts[i] = (px[i] - cx) * s; pts[i + 1] = -(px[i + 1] - cy) * s + 0.1; }
  nameSpan.set(-(x1 - x0) * s / 2, (x1 - x0) * s);
  nameBottomY = -(y1 - y0 + 1) * s / 2 + 0.1;
  return { pts, count: px.length / 2, cell: s };
}
const nameLayers = [];   // layer yang ikut membentuk nama (lengan + inti)
function fillNameTargets(mask) {
  nameLayers.forEach((L, li) => {
    const R = rng(0x6a09e667 ^ Math.imul(li + 1, 0x85ebca6b)), a = L.aName;
    for (let i = 0; i < L.n; i++) {
      const j = Math.floor(R() * mask.count) * 2;
      let x = mask.pts[j] + (R() - .5) * mask.cell, y = mask.pts[j + 1] + (R() - .5) * mask.cell;
      const dust = R() < 0.055;

      a[i * 4 + 2] = (R() - .5) * 0.16 + Math.sin(x * 0.55) * 0.12;
      a[i * 4 + 3] = dust ? 1 : 0;

}
/* ---------- hati 3D ----------
   separuh bintang membentuk garis tepi yang bercahaya, separuh lagi mengisi bagian dalam

const HEART_S = 0.235;

  (13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u) + 2.4) * HEART_S];

const HEART_GRID = 128, HB = { x0: -3.9, x1: 3.9, y0: -3.7, y1: 3.7 };

    for (let i = 0, j = V - 1; i < V; j = i++) {

    v = dist[i - N + 1] + dg; if (v < d) d = v;

  if (!tapStart) return;
  const now = performance.now();
  const isTap = now - tapStart.t < 300 && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 12;
  tapStart = null;
  if (!isTap) { lastTap = null; return; }
  if (lastTap && now - lastTap.t < 380 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 48) {
    lastTap = null; launchShootingStar(toNdc(e));
  } else lastTap = { t: now, x: e.clientX, y: e.clientY };
});

/* ---------- suara: lagu (opsional) + lonceng prosedural ---------- */
const MUSIC_SRC = (DEBUG && PARAMS.get('audio')) || CONFIG.audioSrc;
const snd = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const st = { ctx: null, master: null, chimeBus: null, music: null, musicGain: null, analyser: null, bins: null,
    direct: false, hasMusic: false, wasPlaying: false, muted: false, lastChime: -1e9, note: 2,
    bass: 0, mid: 0, bassAvg: 0, midAvg: 0, bassPeak: 1e-3, midPeak: 1e-3 };
  // C mayor pentatonis, oktaf tinggi (seperti celesta)
  const PENTA = [1046.5, 1174.66, 1318.51, 1567.98, 1760.0, 2093.0, 2349.32];

  function start() {
    if (!AC || st.ctx) return;
    try {
      const ctx = st.ctx = new AC();
      st.master = ctx.createGain(); st.master.gain.value = st.muted ? 0 : 1; st.master.connect(ctx.destination);
      // bus lonceng: lowpass + gema (delay berumpan-balik yang makin redup) -> lembut seperti angin malam
      const bus = st.chimeBus = ctx.createGain();
      const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 5200;
      const dly = ctx.createDelay(1.5); dly.delayTime.value = 0.37;
      const fb = ctx.createGain(); fb.gain.value = 0.4;
      const damp = ctx.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 2300;
      const wet = ctx.createGain(); wet.gain.value = 0.55;
      bus.connect(tone); tone.connect(st.master); tone.connect(dly);
      dly.connect(damp); damp.connect(fb); fb.connect(dly); damp.connect(wet); wet.connect(st.master);
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      loadMusic();
    } catch (e) { st.ctx = null; }
  }

  function loadMusic() {
    if (!MUSIC_SRC) return;
    const a = st.music = new Audio();
    a.loop = true; a.preload = 'auto'; a.setAttribute('playsinline', '');
    // dibuka sebagai file:// -> Web Audio akan membisukan lagunya (aturan keamanan), jadi diputar langsung tanpa analyser
    st.direct = location.protocol === 'file:';
    if (st.direct) a.volume = 0;
    else {
      const node = st.ctx.createMediaElementSource(a);
      const an = st.analyser = st.ctx.createAnalyser();
      an.fftSize = 1024; an.smoothingTimeConstant = 0.8;
      st.bins = new Uint8Array(an.frequencyBinCount);
      st.musicGain = st.ctx.createGain(); st.musicGain.gain.value = 0;
      node.connect(an); an.connect(st.musicGain); st.musicGain.connect(st.master);
    }
    a.addEventListener('error', () => { st.hasMusic = false; }, { once: true });     // file tidak ada -> diam saja
    a.addEventListener('playing', () => {
      st.hasMusic = true;
      if (!st.direct) {                                                               // fade-in 3 detik
        const g = st.musicGain.gain, t = st.ctx.currentTime;
        g.cancelScheduledValues(t); g.setValueAtTime(0, t); g.linearRampToValueAtTime(CONFIG.audioVolume, t + 3);
      }
    }, { once: true });
    a.src = MUSIC_SRC;
    const p = a.play(); if (p) p.catch(() => {});
  }

  function setMuted(m) {
    st.muted = m;
    if (!st.ctx) return;
    const g = st.master.gain, t = st.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.setTargetAtTime(m ? 0 : 1, t, 0.25);   // fade, bukan putus
  }

  // energi bass & mid, dihaluskan (naik cepat, turun pelan) dan dibandingkan dengan rata-rata lagu itu sendiri
  function band(lo, hi) {
    const hz = st.ctx.sampleRate / st.analyser.fftSize, b = st.bins;
    let sum = 0, n = 0;
    for (let i = Math.max(1, Math.floor(lo / hz)); i <= Math.min(b.length - 1, Math.ceil(hi / hz)); i++) { sum += b[i]; n++; }
    return n ? sum / (n * 255) : 0;
  }
  function update(dt) {
    if (st.direct && st.music) {                                                    // file:// : fade lewat volume elemen
      const target = st.muted ? 0 : CONFIG.audioVolume, v = st.music.volume;
      st.music.volume = target > v ? Math.min(target, v + dt * CONFIG.audioVolume / 3) : Math.max(target, v - dt * 1.6);
    }
    let b = 0, m = 0;
    if (st.analyser && st.hasMusic && !st.music.paused) { st.analyser.getByteFrequencyData(st.bins); b = band(30, 160); m = band(300, 2200); }
    const up = 1 - Math.exp(-dt * 14), down = 1 - Math.exp(-dt * 3);
    st.bass += (b - st.bass) * (b > st.bass ? up : down);
    st.mid += (m - st.mid) * (m > st.mid ? up : down);
    const slow = 1 - Math.exp(-dt * 0.5), fall = Math.exp(-dt * 0.12);
    st.bassAvg += (st.bass - st.bassAvg) * slow; st.midAvg += (st.mid - st.midAvg) * slow;
    st.bassPeak = Math.max(st.bass, st.bassPeak * fall); st.midPeak = Math.max(st.mid, st.midPeak * fall);
  }
  const rel = (v, avg, pk) => Math.max(-1, Math.min(1, (v - avg) / Math.max(pk - avg, 0.02)));

  // lonceng: beberapa sinus dengan rasio tak harmonis + peluruhan panjang
  function bell(freq, when, gain) {
    const ctx = st.ctx, t = ctx.currentTime + when;
    const out = ctx.createGain();
    out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(gain, t + 0.015);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 4.5);
    out.connect(st.chimeBus);
    for (const [r, a, d] of [[1, 1, 4.5], [2.76, 0.3, 1.8], [5.4, 0.1, 0.8], [8.93, 0.04, 0.4]]) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq * r;
      g.gain.setValueAtTime(a, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.05);
    }
  }
  function nextNote() {                                   // melangkah dekat (melodis), tidak mengulang nada yang sama
    const step = [-2, -1, 1, 2][Math.floor(Math.random() * 4)];
    st.note = Math.min(PENTA.length - 1, Math.max(0, st.note + step));
    return PENTA[st.note];
  }
  function chime(kind) {
    if (!st.ctx || st.muted || !CONFIG.chime) return;
    const now = st.ctx.currentTime;
    if (kind === 'sweep') {
      if (now - st.lastChime < 1.4) return;               // berjarak: paling sering ~1x per 1,4 detik
      st.lastChime = now;
      bell(nextNote(), 0, 0.03 + Math.random() * 0.012);
    } else {                                              // ganti bentuk: dua nada naik, pelan
      if (now - st.lastChime < 0.4) return;
      st.lastChime = now;
      const a = nextNote();
      bell(a, 0, 0.04);
      bell(PENTA[Math.min(PENTA.length - 1, st.note + 2)], 0.26, 0.03);
    }
  }
  return {
    supported: !!AC, start, setMuted, update, chime,
    get muted() { return st.muted; }, get started() { return !!st.ctx; }, get hasMusic() { return st.hasMusic; },
    breath: () => st.hasMusic ? rel(0.6 * st.mid + 0.4 * st.bass, 0.6 * st.midAvg + 0.4 * st.bassAvg, 0.6 * st.midPeak + 0.4 * st.bassPeak) : 0,
    bass: () => st.hasMusic ? rel(st.bass, st.bassAvg, st.bassPeak) : 0,
    suspend() { if (!st.ctx) return; st.wasPlaying = !!st.music && !st.music.paused; st.music?.pause(); st.ctx.suspend?.().catch(() => {}); },
    resume() { if (!st.ctx) return; st.ctx.resume?.().catch(() => {}); if (st.wasPlaying) st.music.play()?.catch(() => {}); },
    _st: st,
  };
})();

// galaxy bernapas mengikuti lagu (±12% kecerahan); di mode hati, bass mengatur dalamnya denyut
const coreLayer = layers.find((L) => L.kind === 'CORE');
const BASE_INTENSITY = shared.uIntensity.value, CORE_INTENSITY = coreLayer.mat.uniforms.uIntensity.value;
const SWEEP_CHIME = 260;     // makin kecil = lonceng makin mudah berbunyi saat menyapu bintang
let sweepAcc = 0, heartBass = 0;
function updateSound(dt) {
  snd.update(dt);
  const morph = smooth(0, 1, shared.uMorph.value);
  const f = 1 + 0.12 * snd.breath() * (1 - morph);
  shared.uIntensity.value = BASE_INTENSITY * f;
  coreLayer.mat.uniforms.uIntensity.value = CORE_INTENSITY * f;
  // dihaluskan ~0,7 dtk: dalamnya denyut mengikuti suasana bagian lagu (pelan/ramai), bukan tiap ketukan
  heartBass += (snd.bass() - heartBass) * (1 - Math.exp(-dt * 1.4));
  shared.uBeatAmp.value = 0.032 * (1 + 0.6 * heartBass * morph * (1 - shared.uNameMix.value));
  sweepAcc = sweepAcc * Math.exp(-dt * 1.6) + simHits;
  if (sweepAcc > SWEEP_CHIME) { sweepAcc = 0; snd.chime('sweep'); }
}

// tirai pembuka
const veilEl = document.getElementById('veil');
let started = !USE_VEIL;
function begin() {
  if (started) return;
  started = true;
  setCls('started', true);
  veilEl.classList.add('gone');
  setTimeout(() => veilEl.remove(), 1400);
  if (reduceMotion) shared.uIntro.value = 1;
  snd.start();
}
if (USE_VEIL) {
  const vt = document.getElementById('veilText');
  vt.textContent = CONFIG.veil.text || ''; vt.hidden = !CONFIG.veil.text;
  const vb = document.getElementById('veilBtn');
  vb.textContent = CONFIG.veil.button || 'Nyalakan';
  vb.addEventListener('click', begin);
  addEventListener('keydown', (e) => { if (!started && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); begin(); } });
} else {
  veilEl.remove(); setCls('started', true);
  addEventListener('pointerdown', () => snd.start(), { once: true });   // tanpa tirai: suara mulai di sentuhan pertama
}
const bSound = document.getElementById('bSound');
if (snd.supported) {
  bSound.hidden = false;
  bSound.addEventListener('click', () => {
    snd.start();
    const m = !snd.muted;
    snd.setMuted(m);
    bSound.textContent = m ? '✕' : '♪';
    bSound.setAttribute('aria-pressed', String(m));
    bSound.setAttribute('aria-label', m ? 'Nyalakan suara' : 'Matikan suara');
  });
}

/* ---------- tombol ---------- */
const SHAPE_BUTTONS = { galaxy: document.getElementById('bSpiral'), heart: document.getElementById('bHeart'), name: document.getElementById('bName') };
let morphTarget = shared.uMorph.value, nameTarget = shared.uNameMix.value, writeTarget = shared.uWriteIn.value, shape = CONFIG.startShape;
let unnameTimer = 0;
function setShape(next) {
  if (next !== 'galaxy') ensureHeart();
  if (shape === 'name' && next !== 'name') {               // tunda teks pinggir sampai tulisan bintang bubar
    document.body.classList.add('unname');
    clearTimeout(unnameTimer);
    unnameTimer = setTimeout(() => document.body.classList.remove('unname'), 1500);
  } else if (next === 'name') { clearTimeout(unnameTimer); document.body.classList.remove('unname'); }
  if (next === 'heart' && shape !== 'heart') resetHeartMessages();
  if (next !== 'galaxy') closeMemory();
  if (next !== shape) {
    snd.chime('shape');
    // kembalikan rotasi drag pelan ke pose tegak saat ganti bentuk -> hati & nama selalu simetris
    rot.vel.set(0, 0);
    if (rot.target.angleTo(dq.identity()) > 1e-3) { rot.target.identity(); rot.returning = true; }
  }
  shape = next;
  morphTarget = next === 'galaxy' ? 0 : 1;
  if (next !== 'galaxy') nameTarget = next === 'name' ? 1 : 0;
  // masuk ke Nama -> ditulis kiri-ke-kanan; keluar dari Nama -> buyar organik seperti debu tertiup angin
  writeTarget = next === 'name' ? 1 : 0;
  const settled = (shared.uMorph.value <= 0.001 || shared.uMorph.value >= 0.999)
    && (shared.uNameMix.value <= 0.001 || shared.uNameMix.value >= 0.999);
  if (settled) shared.uWriteIn.value = writeTarget;
  for (const [k, b] of Object.entries(SHAPE_BUTTONS)) b.setAttribute('aria-pressed', String(k === next));
  document.body.classList.toggle('heart', next === 'heart');
  document.body.classList.toggle('name', next === 'name');
}
for (const [k, b] of Object.entries(SHAPE_BUTTONS)) b.onclick = () => setShape(k);
document.getElementById('bReset').onclick = () => { rot.vel.set(0, 0); rot.lastInteract = -1e9; };
addEventListener('keydown', (e) => {
  const order = ['galaxy', 'heart', 'name'];
  if (e.key === 'h' || e.key === 'H') setShape(order[(order.indexOf(shape) + 1) % 3]);
});
setShape(CONFIG.startShape);

// target warna atmosfer langit tiap bentuk (gelap pekat & bersih tanpa kabut berlebih)
const BG_EDGE = { flower: new THREE.Color('#0f0c1a'), heart: new THREE.Color('#140911'), base: new THREE.Color('#090b14') };
const _bgEdgeT = new THREE.Color(), _palAccent = new THREE.Color();

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const baseQ = new THREE.Quaternion(), euler = new THREE.Euler();
let introT = 0, autoSpin = 0;
const TRANSITION_S = 3.4;   // lama transisi antar bentuk (detik)
let rafId = 0, paused = document.hidden, glLost = false;
function schedule() { if (!rafId && !paused && !glLost) rafId = requestAnimationFrame(frame); }
function stopLoop() { cancelAnimationFrame(rafId); rafId = 0; }
// tab/aplikasi di latar belakang -> berhenti total (hemat baterai); saat kembali, delta waktu direset
document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if (paused) { stopLoop(); snd.suspend(); } else { clock.getDelta(); schedule(); snd.resume(); }
});
// konteks WebGL hilang (sering di HP saat memori penuh / pindah aplikasi): tunggu dipulihkan, lalu lanjut
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); glLost = true; stopLoop(); });
canvas.addEventListener('webglcontextrestored', () => {
  glLost = false;
  for (const L of layers) for (const a of Object.values(L.points.geometry.attributes)) a.needsUpdate = true;
  resize(); clock.getDelta(); schedule();
});

function frame() {
  rafId = 0;
  const dt = Math.min(clock.getDelta(), 1 / 20), t = clock.elapsedTime, now = performance.now();
  shared.uTime.value = t;

  shared.uDawn.value = Math.min(1, shared.uDawn.value + dt / 2.2);
  if (started && shared.uIntro.value < 1) { introT += dt; shared.uIntro.value = Math.min(introT / 5.5, 1); }
  if (shared.uIntro.value > 0.55) document.body.classList.add('ready');

  const mv = shared.uMorph.value;
  shared.uMorph.value = mv + Math.sign(morphTarget - mv) * Math.min(Math.abs(morphTarget - mv), dt / TRANSITION_S);
  // hati <-> nama berpindah langsung; dari bunga, bentuk tujuan dipilih sebelum morph terlihat (cek mv sebelum naik)
  const nv = shared.uNameMix.value;
  shared.uNameMix.value = mv < 0.001 ? nameTarget
    : nv + Math.sign(nameTarget - nv) * Math.min(Math.abs(nameTarget - nv), dt / TRANSITION_S);
  // kalau tombol diklik di tengah transisi, uWriteIn bergeser mulus tanpa lompatan
  shared.uWriteIn.value += (writeTarget - shared.uWriteIn.value) * (1 - Math.exp(-4.5 * dt));

  // kamera bernapas mundur halus di tengah transisi, lalu kembali mendekat saat bentuk baru mendarat
  const midTrans = Math.max(Math.sin(shared.uMorph.value * Math.PI), Math.sin(shared.uNameMix.value * Math.PI) * shared.uMorph.value);
  camBreath += (midTrans - camBreath) * (1 - Math.exp(-4.5 * dt));
  const camZ = baseCamZ * (1 + 0.055 * camBreath);
  if (Math.abs(camZ - camera.position.z) > 1e-4) {
    camera.position.z = camZ;
    shared.uCamDist.value = camZ;
    shared.uField.value.set(2 * TAN * camZ * shared.uAspect.value, 2 * TAN * camZ);
  }

  // atmosfer langit ikut berubah halus sesuai mode & palet warna nama (tetap obsidian pekat & natural)
  const mEase = ease(0, 1, shared.uMorph.value), keep = 1 - mEase, nEase = ease(0, 1, shared.uNameMix.value);
  _palAccent.set(CONFIG.namePalettes[namePalKey][0]);
  _bgEdgeT.copy(BG_EDGE.base).lerp(_palAccent, 0.005);
  _bgEdgeT.lerpColors(BG_EDGE.heart, _bgEdgeT, nEase);
  _bgEdgeT.lerpColors(BG_EDGE.flower, _bgEdgeT, mEase);
  bgMat.uniforms.uEdge.value.lerp(_bgEdgeT, 1 - Math.exp(-2.2 * dt));

  // inersia setelah dilepas, lalu kembali pelan ke pose awal kalau didiamkan
  if (!rot.pressed && rot.vel.lengthSq() > 1) {
    turn(rot.vel.x * dt, rot.vel.y * dt);
    rot.vel.multiplyScalar(Math.exp(-4.2 * dt));
    rot.lastInteract = now;
  }
  if (!rot.pressed && !rot.returning && now - rot.lastInteract > 4500 && rot.target.angleTo(baseQ.identity()) > 1e-3) {
    rot.target.identity(); rot.returning = true;
  }

  // parallax pasif 3D yang sangat lembut mengikuti kursor / kemiringan HP
  const pStep = 1 - Math.exp(-3.2 * dt);
  parallax.x += (parallax.tx - parallax.x) * pStep;
  parallax.y += (parallax.ty - parallax.y) * pStep;

  const sway = reduceMotion ? 0 : 1;
  autoSpin = reduceMotion ? 0 : Math.atan2(Math.sin(autoSpin + dt * 0.018), Math.cos(autoSpin + dt * 0.018));
  // hati & nama selalu tegak simetris (tanpa roll miring), dengan ayunan 3D halus & parallax tipis
  const heartW = mEase * (1 - nEase), nameW = mEase * nEase;
  const pAmp = 0.075 * keep + 0.036 * heartW + 0.045 * nameW;
  const pitchSway = (0.08 * keep + 0.042 * heartW + 0.045 * nameW) * Math.sin(0.24 * t) * sway;
  const yawSway = (0.14 * keep + 0.095 * heartW + 0.08 * nameW) * Math.cos(0.30 * t) * sway;
  baseQ.setFromEuler(euler.set(
    -0.28 * keep + pitchSway - parallax.y * pAmp * sway,
    yawSway + parallax.x * pAmp * 1.15 * sway,
    autoSpin * keep
  ));
  const base = rot.returning ? 5.5 : 14;
  for (const L of spinners) {
    L.q.slerp(rot.target, 1 - Math.exp(-(base / (1 + L.lag * 0.68 * 2.5)) * dt));   // tiap lapisan telat berbeda -> efek 3D berlapis
    L.points.quaternion.multiplyQuaternions(L.q, baseQ);
    if (L.kind === 'ARM' && !reduceMotion) L.mat.uniforms.uFlow.value = fract(L.mat.uniforms.uFlow.value + L.A.flow * 0.45 * dt);
  }
  if (rot.returning && spinners.every((L) => L.q.angleTo(rot.target) < 1e-3)) rot.returning = false;

  // lensa cahaya: ikut kursor di desktop, ikut jari (lebih halus) selama layar disentuh di HP
  const lensTarget = hover && !rot.pressed ? 1 : touching ? 0.7 : 0;
  shared.uLensActive.value += (lensTarget - shared.uLensActive.value) * (1 - Math.exp(-6 * dt));

  scene.updateMatrixWorld(); camera.updateMatrixWorld();
  simT = t;
  simHits = 0;
  stepSim(dt);
  updateSound(dt);
  updateMemoryStars();
  updateShootingStar(dt);
  updateHeartMessages(dt);
  updatePaletteTween(dt);
  if (sigDirty) { sigDirty = false; placeSig(); }
  setCls('signed', !!CONFIG.nameSignature && shape === 'name' && shared.uMorph.value >= 1 && shared.uNameMix.value >= 1);
  composer.render(dt);
  schedule();
}
schedule();
if (new URLSearchParams(location.search).has('debug')) window.__astra = { shared, layers, rot, bloom, renderer, composer, get heartMs() { return heartMs; }, frameBufferType, heartGrid, buildHeart, shoot, shootMat, launchShootingStar, msgState, get shape() { return shape; }, setNamePalette, snd, begin, get sweepAcc() { return sweepAcc; } };
</script>
</body>
